<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Зарплата</title>
    <meta name="description" content="Персональний облік і розрахунок заробітної плати" />
    <meta name="theme-color" content="#F2F2F7" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Зарплата" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-icon-180.png" />
    <link rel="manifest" href="./app.webmanifest" />
    <script>
      // Apply the saved theme before the first paint so dark mode never flashes white.
      (function () {
        try {
          var t = (JSON.parse(localStorage.getItem('salary_settings') || '{}') || {}).theme;
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.dataset.theme = 'dark';
            document.querySelector('meta[name="theme-color"]').content = '#000000';
            document.querySelector('meta[name="color-scheme"]').content = 'dark';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Увімкни JavaScript, щоб користуватися застосунком.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
