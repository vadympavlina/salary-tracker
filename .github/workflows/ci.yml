name: CI & Deploy

# Every push and PR: unit tests, production build, e2e + responsive tests on
# phones / tablets / desktops in Chromium and WebKit (Safari engine).
# Deploys to GitHub Pages only from the repository's default branch, and only when everything is green.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Project pages are served from /<repo-name>/
  BASE_PATH: /${{ github.event.repository.name }}/

jobs:
  test:
    name: Test (unit, e2e, responsive)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck + unit tests
        run: npx tsc -b && npm test
      - name: Build
        run: npm run build
      - name: Install browsers (Chromium + WebKit)
        run: npx playwright install --with-deps chromium webkit
      - name: E2E + responsive tests
        run: npx playwright test
      - name: Upload test report (screenshots of every page on every device)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
      - name: Upload site for Pages
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
